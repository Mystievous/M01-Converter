name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches project(VERSION)
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Not a tag push, skipping version check."
            exit 0
          fi
          
          tag_version="${GITHUB_REF_NAME#v}"
          cmake_version=$(grep -m1 -oP 'project\([^)]*VERSION\s+\K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)

          if [ -z "$cmake_version" ]; then
            echo "Could not read VERSION from CMakeLists.txt" >&2
            exit 1
          fi

          if [ "$tag_version" != "$cmake_version" ]; then
            echo "Tag v$tag_version != project(VERSION $cmake_version)" >&2
            exit 1
          fi

          echo "Version $cmake_version matches tag."
  build:
    needs: version-guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux
            cmake_args: >-
              "-DCMAKE_CXX_COMPILER=g++-13"
              "-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc"
          - os: macos-latest
            label: macos
            cmake_args: '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"'
          - os: windows-latest
            label: windows
            cmake_args: ""
    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.label }})
    steps:
      - uses: actions/checkout@v4
      - if: matrix.label == 'linux'
        name: setup_linux_g++-13
        shell: bash
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y g++-13
      - name: configure
        run: cmake -S . -B build-package -DM01_FLAT_INSTALL=ON -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}
      - name: build
        run: cmake --build build-package -j --config Release
      - name: package
        run: cmake --build build-package --target package --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: M01-Converter-${{ matrix.label }}
          path: build-package/M01-Converter_*
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: draft-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --draft --generate-notes --verify-tag dist/*/M01-Converter_*